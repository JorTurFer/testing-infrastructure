# BORRADOR de hardening (21/11/2026). Despliegue de infraestructura. NO está subido a ningún repositorio.
#
# Cambios respecto al actual:
#   - Solo corre código de `main` (el job se niega a ejecutarse en cualquier otra rama).
#   - `environment: terraform-apply` con revisores obligatorios y despliegue permitido solo desde `main`:
#     el apply nunca arranca sin aprobación manual.
#   - Identidades de apply distintas de las de plan y sin AdministratorAccess/Owner (ver TRUST-POLICIES.md).
#   - Sin PAT. El provider de GitHub (que escribe secretos de repositorio) usa un token de una GitHub App con permisos mínimos.
#   - Sin token de Grafana (la cuenta ya no existe: eliminar el módulo y el provider de grafana del Terraform).
#   - Mismo pre-check (defensa en profundidad), tomado de la propia rama main.

name: Deploy infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/main.yaml"
  schedule:
    - cron: "0 7 * * 1"   # lunes 07:00 UTC: actualización de AKS
  workflow_dispatch:

permissions: {}

concurrency: terraform

jobs:
  terraform:
    name: Terraform
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: terraform-apply     # Required reviewers + Deployment branches = main
    permissions:
      id-token: write
      contents: read
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      GITHUB_OWNER: kedacore
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pre-check
        run: python3 .github/scripts/terraform-precheck.py terraform

      - name: Create GitHub App token for the github provider (only repository secrets)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TF_APP_ID }}
          private-key: ${{ secrets.TF_APP_PRIVATE_KEY }}
          owner: kedacore
          repositories: keda,keda-performance,testing-infrastructure   # solo los que Terraform escribe

      - name: Log into Azure (apply identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log into AWS (apply role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_TO_ASSUME }}
          aws-region: eu-west-2

      - name: Log into GCP (apply service account)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init
        env:
          BACKEND_SA: ${{ secrets.BACKEND_STORAGE_ACCOUNT_NAME }}
          BACKEND_CONTAINER: ${{ secrets.BACKEND_STORAGE_CONTAINER_NAME }}
          BACKEND_RG: ${{ secrets.BACKEND_STORAGE_RESOURCE_GROUP_NAME }}
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${BACKEND_SA}" \
            -backend-config="container_name=${BACKEND_CONTAINER}" \
            -backend-config="resource_group_name=${BACKEND_RG}"
        working-directory: terraform

      - name: Terraform plan
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: terraform plan -input=false -out=plan.tfplan
        working-directory: terraform

      - name: Terraform apply
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: terraform apply -input=false -auto-approve plan.tfplan
        working-directory: terraform
