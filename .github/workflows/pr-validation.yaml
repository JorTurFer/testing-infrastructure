# Validate a pull request WITHOUT any cloud credentials.
#
# Every job here runs with the `pull_request` trigger, `contents: read` only, no secrets, no OIDC token and no write
# permissions, so it is safe to run on any pull request (forks included). There is deliberately no `terraform plan`
# against the real infrastructure: a plan needs read access to the state, and the state contains secrets. The real plan
# runs after the merge (see main.yaml) and nothing is applied without the approval of the `terraform-apply` environment.
#
# Rules this file follows (do not relax them):
#   - No `pull_request_target`, no `gh pr checkout`, no secrets, no `id-token` permission, no environments.
#   - No data controlled by the pull request is interpolated inside `run:` or `script:`; it is passed through `env:` or files.
#   - `terraform init` uses the provider lock file from `main`, in read-only mode: a pull request cannot make this job
#     download and run a different provider. Provider upgrades therefore fail here until they are merged by a maintainer.
#   - `uses:` should be pinned by SHA before merging (versions are used here for readability; let Renovate pin them).

name: Validate PR

on:
  pull_request:
    paths:
      - "terraform/**"
      - "garbage-collector/**"
      - ".github/workflows/**"
      - ".github/renovate.json5"

permissions: {}   # nothing by default; each job asks for the minimum

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform (fmt, validate, tflint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout the provider lock file from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
          sparse-checkout-cone-mode: false   # the list is a single file
          sparse-checkout: |
            terraform/.terraform.lock.hcl

      - name: Report changes to the provider lock file
        run: |
          if ! diff -q trusted/terraform/.terraform.lock.hcl terraform/.terraform.lock.hcl >/dev/null; then
            echo "::warning file=terraform/.terraform.lock.hcl::The lock file differs from main. This job uses the one from main, so a provider change fails here until a maintainer reviews and merges it."
          fi
          cp trusted/terraform/.terraform.lock.hcl terraform/.terraform.lock.hcl

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -recursive -check -diff
        working-directory: terraform

      - name: Terraform init (no backend, no credentials, lock file from main)
        run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate -no-color
        working-directory: terraform

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read-only; only used by `tflint --init` to download the pinned plugins
        run: |
          tflint --init
          tflint --recursive --format compact
        working-directory: terraform

  security-scan:
    name: Terraform security scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Report-only for now: the existing code has findings nobody has triaged. Set `exit-code: "1"` once they are
      # fixed or ignored (.trivyignore) so that new misconfigurations fail the check.
      - name: Scan the Terraform for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  workflows:
    name: GitHub Actions workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12

      # Static analysis of the workflows themselves: dangerous triggers, template injection, unpinned actions,
      # excessive permissions, credential persistence...
      - name: zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false   # print the findings; uploading SARIF would need `security-events: write`

  go:
    name: Garbage collector (vet, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: garbage-collector/go.mod
          cache: false

      - name: go vet
        run: go vet ./...
        working-directory: garbage-collector

      - name: go test
        run: go test ./...
        working-directory: garbage-collector

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review new or changed dependencies (known vulnerabilities, licenses)
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
