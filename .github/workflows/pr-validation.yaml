# Validate a Terraform pull request without ever giving untrusted code access to cloud credentials.
#
# Design:
#   1) `static` -> INERT: runs on any pull request (forks included) with NO secrets, NO OIDC token and NO write permissions.
#   2) `plan`   -> real plan with credentials, only for pull requests from branches of this repository and ONLY after a
#                  maintainer approves the `terraform-plan` environment (required reviewers). The cloud identifiers live as
#                  secrets OF THE ENVIRONMENT (not of the repository), so `static` or any other workflow cannot read them.
#
# Rules this file follows (do not relax them):
#   - No `pull_request_target` and no `gh pr checkout`.
#   - No data controlled by the pull request is interpolated inside `run:` or `script:`; it is passed through `env:` or files.
#   - The pre-check script is taken from `main` (the `trusted/` folder), never from the pull request code.
#   - No personal access token and no Grafana token. The plan uses READ-ONLY identities (see .github/CI-SECURITY.md).
#   - `uses:` should be pinned by SHA before merging (versions are used here for readability; let Renovate pin them).

name: Validate PR

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/pr-validation.yaml"
      - ".github/scripts/**"

permissions: {}   # nothing by default; each job asks for the minimum

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout PR (untrusted code)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout trusted scripts from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            terraform/.terraform.lock.hcl

      - name: Pre-check (blocks external data sources, provisioners, unknown providers/modules, backend and provider redirection)
        run: python3 trusted/.github/scripts/terraform-precheck.py terraform --lock-base trusted/terraform/.terraform.lock.hcl

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Terraform fmt
        run: terraform fmt -recursive -check
        working-directory: terraform

      - name: Terraform init (no backend, no credentials)
        run: terraform init -backend=false -input=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate -no-color
        working-directory: terraform

      - name: TFLint
        run: |
          tflint --init
          tflint -f compact
        working-directory: terraform

  plan:
    name: Plan (requires maintainer approval)
    needs: static
    # Only branches of this repository. Forks never reach this job; if a maintainer wants a plan for an external pull request,
    # they review the diff and push the branch to this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a plan should never take this long: fail instead of hanging
    # MANUAL APPROVAL: this job does not start until a reviewer of the environment approves it.
    # Configure the environment with: required reviewers = maintainers team, "Prevent self-review", no repository-level secrets.
    environment: terraform-plan
    permissions:
      id-token: write    # OIDC, only available after the approval
      contents: read
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout the exact approved commit (untrusted code)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout trusted scripts from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            terraform/.terraform.lock.hcl

      - name: Pre-check again on the approved commit (the PR may have changed after the static job)
        run: python3 trusted/.github/scripts/terraform-precheck.py terraform --lock-base trusted/terraform/.terraform.lock.hcl

      - name: Log into Azure (plan identity, read-only)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log into AWS (plan role, read-only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_TO_ASSUME }}
          aws-region: eu-west-2

      - name: Log into GCP (plan service account, read-only)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAN_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init
        env:
          BACKEND_SA: ${{ secrets.BACKEND_STORAGE_ACCOUNT_NAME }}
          BACKEND_CONTAINER: ${{ secrets.BACKEND_STORAGE_CONTAINER_NAME }}
          BACKEND_RG: ${{ secrets.BACKEND_STORAGE_RESOURCE_GROUP_NAME }}
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=${BACKEND_SA}" \
            -backend-config="container_name=${BACKEND_CONTAINER}" \
            -backend-config="resource_group_name=${BACKEND_RG}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}"
        working-directory: terraform

      - name: Terraform plan (read-only, no state lock)
        run: terraform plan -no-color -input=false -lock=false 2>&1 | tee ../plan.txt
        working-directory: terraform

      - name: Publish the plan in the run summary (as text, never as code)
        if: always()
        run: |
          {
            echo '### Terraform plan'
            echo 'Commit: `'"${GITHUB_SHA}"'` approved manually'
            echo '```'
            sed 's/```/` ` `/g' plan.txt | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
